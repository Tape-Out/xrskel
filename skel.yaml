xrskel: 1

rules:
  # .in 脱后缀：叫 ip.yaml 就会被发现成包，叫 mk*.py 就会被当测试台跑
  suffix: .in
  # dot. 还原成 .：dotfile 进 wheel 会丢，真 .github 会触发组织门禁
  dotted: dot.
  # 前面带 $ 的不算——那是 GitHub Actions 的 ${{ }}
  placeholders: [name, Name, NAME, org, year]

includes:
  base: common/base

templates:
  ip/regmap:
    group: ip
    title: 外设 IP，带寄存器图
    hint: 大多数外设走这条：软件经总线读写寄存器
    include: [base]
  ip/plain:
    group: ip
    title: 外设 IP，不带寄存器图
    hint: 控制口不对外露的那类，如调试模块
    include: [base]
  lib:
    group: lib
    title: 库
    hint: 只贡献源码，不被例化，没有旋钮也没有地址
    include: [base]
  asm:
    group: asm
    title: 装配
    hint: 有 instances，自己不带 RTL
    include: [base]

# blackbox 等 spec 的 kind: foreign 落地再加
